name: agent-gateway

# 暴露面：只有 nginx 映射端口；gateway 与 opencode 仅在 internal 网络内，宿主机也连不上。
#
# 注意：每个 opencode-N 服务都必须完整写出 environment 与 volumes。
# YAML 的 <<: 合并是浅合并，子服务一旦定义 volumes / environment 就会整体覆盖锚点里的同名键。
#
# 注意：三个实例共用同一个镜像 tag，因此 build 只写在 opencode-1 上。
# 若每个服务都写 build，compose 会并行构建并抢写同一个 tag，报
# "image agent-opencode:local already exists"。
#
# 注意：opencode 的配置（opencode.json、agents/*.md）在构建期由
# opencode/Dockerfile 打进镜像，这里不再 bind mount 配置目录。
# 只读挂载会让 opencode 启动写 .gitignore 时 EROFS，实例 bootstrap 失败。
# 改配置后需要 rebuild 才能生效：docker compose up -d --build opencode-1

x-opencode-base: &opencode-base
  image: agent-opencode:local
  restart: unless-stopped
  networks:
    - internal

# 模型接入：opencode 启动时从这两个变量读服务地址与密钥。
# 用 YAML 合并键 << 注入到各实例的 environment 内，避免三份重复。
# MODEL_BASE_URL 留空时回退到 provider 官方地址。
x-opencode-model-env: &opencode-model-env
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  MODEL_API_KEY: ${MODEL_API_KEY:-}

services:
  # 模拟模型服务：OpenAI 兼容的假模型，让整条链路不依赖任何外部模型。
  # 默认随 `docker compose up -d` 一起启动。曾经用 profile 隔离，结果 .env.example
  # 默认把 MODEL_BASE_URL 指向它、而 README 的主启动命令不带 --profile，
  # 于是照文档走的人第一步就连不上模型，所有任务失败 —— 所以这里不再隔离。
  # 它不映射端口，只在内部网络里供 opencode 访问；生产环境跑着也无害，
  # 接上真实模型后想省资源可以 `docker compose stop mock-model`。
  mock-model:
    image: agent-mock-model:local
    build:
      context: ./mock-model
      dockerfile: Dockerfile
    container_name: agent-mock-model
    restart: unless-stopped
    networks:
      - internal
    # 同样不映射端口，只在内部网络里供 opencode 访问

  nginx:
    image: nginx:1.27-alpine
    container_name: agent-nginx
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./data/certbot:/var/www/certbot
      - ./data/nginx-logs:/var/log/nginx
    # 探针打 nginx 自己的 /healthz，不经过 gateway：
    # 网关挂掉时不该把 nginx 也判成不健康，否则 heal 会去重建一个没问题的容器。
    # 用明文 80 而不是 https，省掉自签证书的校验问题。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    image: agent-gateway:local
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: agent-gateway
    restart: unless-stopped
    networks:
      - internal
    # 这里没有 ports —— 网关不对公网开放，只能被 nginx 通过内部网络访问
    env_file:
      - .env
    environment:
      # 实例名册：host:port:password，密码来自 .env，与各实例保持同一来源
      OPENCODE_INSTANCES: >-
        opencode-1:4096:${OC1_PASSWORD},opencode-2:4096:${OC2_PASSWORD},opencode-3:4096:${OC3_PASSWORD}
      OPENCODE_SERVER_USERNAME: opencode
    volumes:
      # 用命名卷而不是 bind mount：容器以 uid 1000 运行，bind mount 的目录属主是 root，
      # SQLite 会直接写不进去。命名卷首次挂载会继承镜像内的属主，省掉手工 chown。
      - gateway-data:/srv/agent/data
    depends_on:
      opencode-1:
        condition: service_healthy
      opencode-2:
        condition: service_healthy
      opencode-3:
        condition: service_healthy

  opencode-1:
    <<: *opencode-base
    container_name: agent-opencode-1
    # 三实例共用 agent-opencode:local，构建只在这里发生
    build:
      context: ../opencode
      dockerfile: Dockerfile
    environment:
      <<: *opencode-model-env
      OPENCODE_SERVER_PASSWORD: ${OC1_PASSWORD}
      HTTP_PROXY: ${FETCH_HTTP_PROXY:-}
      HTTPS_PROXY: ${FETCH_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,gateway,nginx,mock-model,opencode-2,opencode-3
    volumes:
      - workspace:/srv/agent/workspace
      - oc1-data:/home/app/.local/share

  opencode-2:
    <<: *opencode-base
    container_name: agent-opencode-2
    environment:
      <<: *opencode-model-env
      OPENCODE_SERVER_PASSWORD: ${OC2_PASSWORD}
      HTTP_PROXY: ${FETCH_HTTP_PROXY:-}
      HTTPS_PROXY: ${FETCH_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,gateway,nginx,mock-model,opencode-1,opencode-3
    volumes:
      - workspace:/srv/agent/workspace
      - oc2-data:/home/app/.local/share

  opencode-3:
    <<: *opencode-base
    container_name: agent-opencode-3
    environment:
      <<: *opencode-model-env
      OPENCODE_SERVER_PASSWORD: ${OC3_PASSWORD}
      HTTP_PROXY: ${FETCH_HTTP_PROXY:-}
      HTTPS_PROXY: ${FETCH_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,gateway,nginx,mock-model,opencode-1,opencode-2
    volumes:
      - workspace:/srv/agent/workspace
      - oc3-data:/home/app/.local/share

networks:
  internal:
    driver: bridge

volumes:
  workspace:
  gateway-data:
  oc1-data:
  oc2-data:
  oc3-data:

# 扩容：复制一个 opencode-N 服务块（改容器名、密码变量、卷名），
# 并在 gateway 的 OPENCODE_INSTANCES 与 depends_on 里同步追加。
