# 注意：本文件是以单文件 bind mount 挂进容器的。改完这里之后，
# `nginx -s reload` 只会重载「容器创建时挂进去的那个 inode」，看不到新内容
# （git pull / 编辑器保存都是「写新文件再 rename」，旧 inode 已被 unlink）。
# 必须重建容器才会生效：docker compose up -d --force-recreate nginx
# 只跑 `docker compose up -d` 不够——挂载文件的内容变化不在 compose 的配置哈希里。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 2m;
    client_body_timeout  30s;

    # 只记 $uri，不记 $request / $args：WebSocket 的 token 在查询串里，避免落进日志
    log_format main '$remote_addr - $status ${request_time}s "$request_method $uri" '
                    'ua="$http_user_agent" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    # ---------- 限流 ----------
    # 普通接口：每 IP 120 次/分钟
    limit_req_zone $binary_remote_addr zone=ip_general:10m rate=120r/m;
    # 提交任务：每 IP 120 次/分钟，burst 30
    #
    # 这里按 IP 限流而不是按用户，所以必须假设「一个 IP 后面可能有很多用户」：
    # App 后端代理转发、企业出口 NAT、运营商 NAT 都会让 20 个用户共用同一个源 IP。
    # 原来写 20r/m + burst 5，实测 20 人同时提交只有 6 个通过，其余全是 429。
    # 真正的用量闸在业务侧（每用户每日配额 + 在途上限 + 队列深度），
    # 这一层只做粗粒度的洪水防护，别让它挡住正常的并发用户。
    limit_req_zone $binary_remote_addr zone=ip_submit:10m rate=120r/m;
    # SSE 单独一个桶：长连接一次只占 1 个请求，但绝不能和轮询共用额度。
    # 实测 20 个并发任务若靠轮询查状态，20 秒内就会打出上百次 GET，
    # 把 ip_general 打满后连 SSE 都会被 429 挡在门外（实测 154/400 被拒）。
    limit_req_zone $binary_remote_addr zone=ip_sse:10m rate=60r/m;
    limit_req_status 429;

    # ---------- WebSocket 升级 ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 以下 proxy_* 在 http 作用域生效，对全部 location 生效，避免重复配置
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 这里刻意不用 upstream 块。upstream 里的主机名只在 nginx 启动时解析一次，
    # 之后永久缓存 —— 而 `docker compose up -d` 重建 gateway 容器会给它分配新的 IP，
    # 于是 nginx 一直去连那个已经不存在的旧 IP，**每个请求都 502**，直到 nginx 也被重建。
    # 实测：gateway 从 172.31.1.5 变成 172.31.1.7 后，日志里全是
    # `connect() failed (111: Connection refused) ... upstream: "http://172.31.1.5:8080/..."`。
    #
    # 改成「变量 + resolver」后，名字在每次请求时按 valid=10s 重新解析，网关重建后
    # 最多 10 秒自愈。代价是失去 upstream 的 keepalive（每个请求新建一条连接），
    # 对这个规模的服务可以忽略；换来的是「重新部署网关不会把站点打挂」。
    #
    # 127.0.0.11 是 Docker 内置 DNS。若把 nginx 移出容器（宿主机直接跑 nginx），
    # 要把它改成宿主机 /etc/resolv.conf 里的 DNS 地址，否则域名解析失败会全站 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # 注意：`set` 只能写在 server / location / if 里，写在这一层 nginx 会因
    # "set directive is not allowed here" 直接启动失败，所以它放在下面 443 的
    # server 块里。末尾不要带斜杠，否则会替换掉请求 URI 而只请求 "/"。

    # ---------- 80：仅用于 ACME 验证与跳转 ----------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- 443：唯一对外入口 ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name agent.example.com;   # 改成你的域名

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 后端地址放变量里，配合上面的 resolver 实现「重新部署网关后自动重解析」
        set $gateway_up http://gateway:8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # 健康检查：不限流，供探活使用
        location = /api/v1/health {
            proxy_pass $gateway_up;
        }

        # 提交任务
        location = /api/v1/tasks {
            limit_req zone=ip_submit burst=30 nodelay;
            proxy_pass $gateway_up;
        }

        # SSE 流式：必须关闭缓冲，否则前端会一次性收到全部内容
        location ~ ^/api/v1/tasks/[^/]+/events$ {
            limit_req zone=ip_sse burst=20 nodelay;
            proxy_pass $gateway_up;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # WebSocket 流式
        location /api/v1/ws/ {
            limit_req zone=ip_general burst=20 nodelay;
            proxy_pass $gateway_up;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 其余 API
        location /api/v1/ {
            limit_req zone=ip_general burst=40 nodelay;
            proxy_pass $gateway_up;
        }

        # OpenAPI 规范：给 App 开发方生成 SDK 用，限制频率即可
        location = /openapi.json {
            limit_req zone=ip_general burst=10 nodelay;
            proxy_pass $gateway_up;
        }

        # 管理接口只允许内网访问
        location /internal/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass $gateway_up;
        }

        location / {
            return 404;
        }
    }
}
