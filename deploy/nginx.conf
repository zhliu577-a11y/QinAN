worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 2m;
    client_body_timeout  30s;

    # 只记 $uri，不记 $request / $args：WebSocket 的 token 在查询串里，避免落进日志
    log_format main '$remote_addr - $status ${request_time}s "$request_method $uri" '
                    'ua="$http_user_agent" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    # ---------- 限流 ----------
    # 普通接口：每 IP 120 次/分钟
    limit_req_zone $binary_remote_addr zone=ip_general:10m rate=120r/m;
    # 提交任务：每 IP 120 次/分钟，burst 30
    #
    # 这里按 IP 限流而不是按用户，所以必须假设「一个 IP 后面可能有很多用户」：
    # App 后端代理转发、企业出口 NAT、运营商 NAT 都会让 20 个用户共用同一个源 IP。
    # 原来写 20r/m + burst 5，实测 20 人同时提交只有 6 个通过，其余全是 429。
    # 真正的用量闸在业务侧（每用户每日配额 + 在途上限 + 队列深度），
    # 这一层只做粗粒度的洪水防护，别让它挡住正常的并发用户。
    limit_req_zone $binary_remote_addr zone=ip_submit:10m rate=120r/m;
    limit_req_status 429;

    # ---------- WebSocket 升级 ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 以下 proxy_* 在 http 作用域生效，对全部 location 生效，避免重复配置
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    upstream gateway_up {
        server gateway:8080;
        keepalive 32;
    }

    # ---------- 80：仅用于 ACME 验证与跳转 ----------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- 443：唯一对外入口 ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name agent.example.com;   # 改成你的域名

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # 健康检查：不限流，供探活使用
        location = /api/v1/health {
            proxy_pass http://gateway_up;
        }

        # 提交任务
        location = /api/v1/tasks {
            limit_req zone=ip_submit burst=30 nodelay;
            proxy_pass http://gateway_up;
        }

        # SSE 流式：必须关闭缓冲，否则前端会一次性收到全部内容
        location ~ ^/api/v1/tasks/[^/]+/events$ {
            limit_req zone=ip_general burst=20 nodelay;
            proxy_pass http://gateway_up;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # WebSocket 流式
        location /api/v1/ws/ {
            limit_req zone=ip_general burst=20 nodelay;
            proxy_pass http://gateway_up;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 其余 API
        location /api/v1/ {
            limit_req zone=ip_general burst=40 nodelay;
            proxy_pass http://gateway_up;
        }

        # OpenAPI 规范：给 App 开发方生成 SDK 用，限制频率即可
        location = /openapi.json {
            limit_req zone=ip_general burst=10 nodelay;
            proxy_pass http://gateway_up;
        }

        # 管理接口只允许内网访问
        location /internal/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://gateway_up;
        }

        location / {
            return 404;
        }
    }
}
