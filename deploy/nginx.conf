# 注意：本文件是以单文件 bind mount 挂进容器的。改完这里之后，
# `nginx -s reload` 只会重载「容器创建时挂进去的那个 inode」，看不到新内容
# （git pull / 编辑器保存都是「写新文件再 rename」，旧 inode 已被 unlink）。
# 必须重建容器才会生效：docker compose up -d --force-recreate nginx
# 只跑 `docker compose up -d` 不够——挂载文件的内容变化不在 compose 的配置哈希里。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 2m;
    client_body_timeout  30s;

    # 只记 $uri，不记 $request / $args：WebSocket 的 token 在查询串里，避免落进日志
    log_format main '$remote_addr - $status ${request_time}s "$request_method $uri" '
                    'ua="$http_user_agent" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    # ---------- 限流 ----------
    # 限流键 `$rl_key`：带凭证的请求按 token 限流，没带凭证的退回按来源 IP。
    map $http_authorization $rl_key {
        default            $remote_addr;
        "~^Bearer\s+\S"    $http_authorization;
    }
    #
    # 关于 $remote_addr 的真实性（实测结论，别再照抄旧说法）：
    #   端口经 docker 发布，连接经过 docker-proxy/DNAT，但**外部客户端的来源 IP 是保留的**
    #   —— 宿主机 curl 经 127.0.0.1:8443 进来，access.log 记到的是 10.0.2.2。
    #   只有「从本机经发布端口」发起的请求会被折叠成 docker 网桥网关（实测 172.31.1.1）。
    #   所以按来源 IP 限流对外部客户端是有效的；本机自测流量会共用同一个桶，
    #   别拿本机压测出来的 429 比例去推断线上限流行为。
    #
    # 按凭证限流的代价（已知并接受）：
    #   * 桶的 key 就是 token 原文，只存在于 nginx worker 的共享内存（容器内 RAM，不落盘）；
    #   * 重新登录 / 换 Token 会拿到新桶，等于重置额度。这条路径需要凭据才能走，
    #     能重置几次被「能拿到多少凭据」限住。
    #
    # 当前定位：只做粗粒度洪水防护。真正的用量闸在业务侧（每用户每日配额 +
    # 在途上限 + 队列深度）。
    # 参考：原来写 20r/m + burst 5，实测 20 人同时提交只有 6 个通过，其余全是 429。
    limit_req_zone $rl_key zone=rl_general:10m rate=120r/m;
    # 提交任务
    limit_req_zone $rl_key zone=rl_submit:10m rate=120r/m;
    # SSE 单独一个桶：长连接一次只占 1 个请求，但绝不能和轮询共用额度。
    # 实测 20 个并发任务若靠轮询查状态，20 秒内就会打出上百次 GET，
    # 把 rl_general 打满后连 SSE 都会被 429 挡在门外（实测 154/400 被拒）。
    limit_req_zone $rl_key zone=rl_sse:10m rate=60r/m;
    # 登录 / 换 Token / 刷新：可被暴力尝试的接口，单独给严格桶。
    # 这几个请求不带 Authorization，key 自然退回来源 IP —— 正是登录防爆破想要的口径。
    limit_req_zone $rl_key zone=rl_auth:10m rate=20r/m;
    limit_req_status 429;

    # ---------- WebSocket 升级 ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 以下 proxy_* 在 http 作用域生效，对全部 location 生效，避免重复配置
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 这里刻意不用 upstream 块。upstream 里的主机名只在 nginx 启动时解析一次，
    # 之后永久缓存 —— 而 `docker compose up -d` 重建 gateway 容器会给它分配新的 IP，
    # 于是 nginx 一直去连那个已经不存在的旧 IP，**每个请求都 502**，直到 nginx 也被重建。
    # 实测：gateway 从 172.31.1.5 变成 172.31.1.7 后，日志里全是
    # `connect() failed (111: Connection refused) ... upstream: "http://172.31.1.5:8080/..."`。
    #
    # 改成「变量 + resolver」后，名字在每次请求时按 valid=10s 重新解析，网关重建后
    # 最多 10 秒自愈。代价是失去 upstream 的 keepalive（每个请求新建一条连接），
    # 对这个规模的服务可以忽略；换来的是「重新部署网关不会把站点打挂」。
    #
    # 127.0.0.11 是 Docker 内置 DNS。若把 nginx 移出容器（宿主机直接跑 nginx），
    # 要把它改成宿主机 /etc/resolv.conf 里的 DNS 地址，否则域名解析失败会全站 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # 注意：`set` 只能写在 server / location / if 里，写在这一层 nginx 会因
    # "set directive is not allowed here" 直接启动失败，所以它放在下面 443 的
    # server 块里。末尾不要带斜杠，否则会替换掉请求 URI 而只请求 "/"。

    # ---------- 80：仅用于 ACME 验证与跳转 ----------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- 443：唯一对外入口 ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name agent.example.com;   # 改成你的域名

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 后端地址放变量里，配合上面的 resolver 实现「重新部署网关后自动重解析」
        set $gateway_up http://gateway:8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # 健康检查：不限流，供探活使用
        location = /api/v1/health {
            proxy_pass $gateway_up;
        }

        # 登录 / 换 Token / 刷新：严格桶，防暴力尝试。
        # 必须放在正则 location 里，才能盖过下面 `location /api/v1/` 的宽松桶。
        location ~ ^/api/v1/auth/(token|exchange|refresh)$ {
            limit_req zone=rl_auth burst=10 nodelay;
            proxy_pass $gateway_up;
        }

        # 提交任务
        location = /api/v1/tasks {
            limit_req zone=rl_submit burst=30 nodelay;
            proxy_pass $gateway_up;
        }

        # SSE 流式：必须关闭缓冲，否则前端会一次性收到全部内容
        location ~ ^/api/v1/tasks/[^/]+/events$ {
            limit_req zone=rl_sse burst=20 nodelay;
            proxy_pass $gateway_up;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # WebSocket 流式
        location /api/v1/ws/ {
            limit_req zone=rl_general burst=20 nodelay;
            proxy_pass $gateway_up;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 其余 API
        location /api/v1/ {
            limit_req zone=rl_general burst=40 nodelay;
            proxy_pass $gateway_up;
        }

        # OpenAPI 规范：给 App 开发方生成 SDK 用，限制频率即可
        location = /openapi.json {
            limit_req zone=rl_general burst=10 nodelay;
            proxy_pass $gateway_up;
        }

        # 管理接口一律不从公网入口暴露。
        #
        # `deny all` 是无条件的，不依赖来源 IP，所以不受 docker-proxy/DNAT 的
        # 影响 —— 这一条在任何网络模式下都成立。
        #
        # 但不要改成 allow 白名单（包括 allow 127.0.0.1）：这一层的白名单要为
        # 「最终是哪个地址进来」负责，而公网入口的地址归属应该由防火墙/安全组
        # 定义。在 nginx 里再写一份，线上换入口（加一层 LB、改成 host 网络）
        # 时极容易和实际脱节，看起来限制了其实没有。
        #
        # 管理操作请直接打到 gateway 容器（它只在 internal 网络里）：
        #   docker compose exec gateway curl -s http://127.0.0.1:8080/internal/...
        location /internal/ {
            deny all;
        }

        location / {
            return 404;
        }
    }
}
